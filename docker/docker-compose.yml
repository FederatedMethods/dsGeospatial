services:
  rock-geospatial:
    image: rock-grove:0.0.0.9000
    platform: linux/amd64
    environment:
      ROCK_ID: rock-grove-01
      ROCK_CLUSTER: ds-geospatial

  rock-default:
    image: rock-grove:0.0.0.9000
    platform: linux/amd64
    environment:
      ROCK_ID: rock-grove-01
      ROCK_CLUSTER: default
    ports:
      - "8085:8085"
